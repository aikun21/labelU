<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
  <title>Video Annotator</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif; color: #555; background: #fff;
    }
    .spinner {
      width: 36px; height: 36px; margin-bottom: 16px;
      border: 3px solid #e5e7eb; border-top-color: #1b67ff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div>正在启动服务…</div>
</body>
</html>
